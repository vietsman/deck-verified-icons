name: Create Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract version from theme.json
        id: extract
        run: |
          set -euo pipefail
          echo "Searching for theme.json under Deck Verified Icons..."
          # Look for theme.json in Deck Verified Icons directory
          file=$(find . -type f \( -path "./Deck\ Verified\ Icons/*theme.json" -o -path "./Deck\ Verified\ Icons/theme.json" \) | head -n1 || true)
          if [ -z "$file" ]; then
            echo "No theme.json found under Deck Verified Icons"
            exit 1
          fi
          echo "Using file: $file"
          # Try jq-based extraction for common keys
          version=""
          if command -v jq >/dev/null 2>&1; then
            version=$(jq -r '(.version // .manifest.version // .theme.version // .info.version // .meta.version) // empty' "$file" | head -n1)
          fi
          # Fallback to a grep-based extraction if jq didn't find it
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            version=$(grep -Eo '"version"[[:space:]]*:[[:space:]]*"[^"]+"' "$file" | head -n1 | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^\\"]+)".*/\1/')
          fi
          if [ -z "$version" ]; then
            echo "Could not extract version from $file"
            exit 1
          fi
          echo "Found version: $version"
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Zip DeckVerifiedIcons
        id: zip
        run: |
          set -euo pipefail
          zipname="DeckVerifiedIcons-latest.zip"
          rm -f "$zipname"
          if [ ! -d "Deck Verified Icons" ]; then
            echo 'Directory "Deck Verified Icons" not found'
            exit 1
          fi
          zip -r "$zipname" "Deck Verified Icons"
          echo "zipfile=$zipname" >> $GITHUB_OUTPUT

      - name: Create release and upload asset
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.extract.outputs.version }}
          name: ${{ steps.extract.outputs.version }}
          artifacts: DeckVerifiedIcons-latest.zip
